services:
  app:
    image: composer:latest
    working_dir: /app
    entrypoint: ["php"]
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    command: ["-S", "0.0.0.0:8000", "-t", "public"]

  composer:
    image: composer:latest
    working_dir: /app
    volumes:
      - ./:/app

  tests:
    image: composer:latest
    working_dir: /app
    entrypoint: ["php"]
    volumes:
      - ./:/app
    command: ["vendor/bin/phpunit"]